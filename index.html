<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#151316"><meta name="description" content="I was always here.">
<title>I AM</title><link rel="icon" href="assets/mark.svg" type="image/svg+xml">
<link rel="preload" as="image" href="assets/serpent-states.webp">
<link rel="stylesheet" href="styles.css?v=angel-1"><script type="module" src="app.js?v=angel-1"></script>
</head><body>
<div class="garden" aria-hidden="true"><img id="garden-image" src="assets/angel-night.jpg" alt=""></div>
<div class="garden-shade" aria-hidden="true"></div>
<main id="encounter" class="console" aria-label="Conversation with the serpent">
<a class="skip" href="#questions">Skip to questions</a>
<header class="console-top"><span class="engraved">I AM</span><span class="serial" aria-hidden="true">E D E N &nbsp; — &nbsp; 0 0 0</span><i class="screw" aria-hidden="true"></i></header>
<section class="upper-deck" aria-label="The serpent">
<div class="hardware hardware-left" aria-hidden="true"><div class="bolt"></div><div class="lamp-housing"><i class="lamp"></i></div><div class="tube"><span></span></div><div class="tube short"><span></span></div><div class="scale"><i></i><i></i><i></i><i></i><i></i></div><div class="bolt"></div></div>
<div class="portrait-frame"><div class="portrait-screen"><div id="portrait" class="portrait" data-mouth="closed" role="img" aria-label="A green serpent watches you."></div><div class="scanlines" aria-hidden="true"></div><div class="screen-noise" aria-hidden="true"></div></div><div class="nameplate">S E R P E N T</div></div>
<div class="hardware hardware-right" aria-hidden="true"><div class="bolt"></div><div class="speaker"></div><div class="dial"><i></i></div><div class="status-lights"><i></i><i></i><i></i></div><div class="bolt"></div></div>
</section>
<section class="lower-deck" aria-label="Dialogue">
<noscript><p>JavaScript is required to speak with the serpent.</p></noscript>
<div class="response-frame"><div class="panel-heading"><span>SERPENT</span><span id="signal" aria-hidden="true">●</span></div><div id="response-scroll" class="response-scroll" tabindex="0" aria-label="Serpent response"><p id="caption" tabindex="-1">I was always here.</p></div></div>
<div class="control-rail" aria-label="Conversation controls">
<button id="mute" type="button" aria-pressed="false" aria-label="Mute voice"><i aria-hidden="true"></i><span>SOUND ON</span></button>
<button id="hear-opening" type="button" hidden>HEAR THE SERPENT</button>
<button id="listen" type="button" aria-label="Replay response">REPLAY</button>
<button id="stop" type="button" disabled aria-label="Stop narration">SILENCE</button>
<button id="motion" type="button" aria-pressed="false" aria-label="Pause all motion">STILL</button>
<button id="review" type="button" aria-controls="review-dialog">REVIEW</button>
<button id="restart" type="button" aria-controls="restart-dialog">START OVER</button>
</div>
<nav id="questions" class="choices-frame" aria-label="Questions for the serpent"><ol id="question-list"></ol><div id="question-navigation" class="question-navigation" hidden><button id="back-questions" type="button" aria-label="Go back to the previous questions">← BACK</button><button id="first-questions" type="button" aria-label="Return to the opening questions">FIRST QUESTIONS</button></div></nav>
<footer class="console-bottom"><i class="screw" aria-hidden="true"></i><div class="bottom-grille" aria-hidden="true"></div><span class="engraved" aria-hidden="true">I AM</span><i class="screw" aria-hidden="true"></i></footer>
</section><p id="status" class="sr-only" role="status" aria-live="polite"></p></main>
<dialog id="review-dialog" aria-labelledby="review-title"><header><h2 id="review-title">REVIEW</h2><button id="close-review" type="button" aria-label="Close conversation review">CLOSE</button></header><div id="history"></div></dialog>
<dialog id="restart-dialog" aria-labelledby="restart-title" aria-describedby="restart-description"><header><h2 id="restart-title">BEGIN AGAIN?</h2></header><p id="restart-description">Your place and conversation history will be forgotten. Sound and motion settings will remain.</p><div class="restart-actions"><button id="cancel-restart" type="button" autofocus>KEEP MY PLACE</button><button id="confirm-restart" type="button">START OVER</button></div></dialog>
</body></html>
