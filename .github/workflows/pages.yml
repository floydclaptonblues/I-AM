name: Publish the garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garden-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check application
        run: |
          npm test
          npm run check
      - name: Check browser interactions and accessibility
        # The same browser checks run on the working branch before publication.
        # Keep production gated on interaction, layout and accessibility checks.
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 axe-core@4.11.0
          npx playwright install --with-deps chromium
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-production-review
          path: test-results/
      - name: Package public site
        run: |
          mkdir -p _site
          cp index.html styles.css .nojekyll ./*.js _site/
          cp -R assets _site/assets
          node scripts/stamp-build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

