name: Publish the garden

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: garden-pages
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Check application
        run: |
          npm test
          npm run check
      - name: Find recordings verified for this exact commit
        id: verified-voices
        uses: actions/github-script@v8
        with:
          script: |
            const runs = await github.rest.actions.listWorkflowRuns({
              ...context.repo, workflow_id: 'verify.yml', head_sha: context.sha,
              status: 'success', per_page: 10
            });
            for (const run of runs.data.workflow_runs) {
              const artifacts = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: run.id
              });
              if (artifacts.data.artifacts.some(a => a.name === 'synchronized-voice-recordings' && !a.expired)) {
                core.setOutput('run-id', String(run.id));
                break;
              }
            }
      - uses: actions/download-artifact@v4
        if: steps.verified-voices.outputs.run-id != ''
        with:
          name: synchronized-voice-recordings
          path: assets/audio
          github-token: ${{ github.token }}
          run-id: ${{ steps.verified-voices.outputs.run-id }}
      - uses: ./.github/actions/prepare-voices
        if: steps.verified-voices.outputs.run-id == ''
      - name: Check browser interactions and accessibility
        # The same browser checks run on the working branch before publication.
        # Keep production gated on interaction, layout and accessibility checks.
        run: |
          npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 axe-core@4.11.0
          npx playwright install --with-deps chromium
          sudo apt-get install -y ffmpeg
          node scripts/prepare-background.mjs
          npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-production-review
          path: test-results/
      - name: Package public site
        run: |
          mkdir -p _site
          cp index.html styles.css .nojekyll ./*.js _site/
          cp -R assets _site/assets
          node scripts/stamp-build.mjs
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

