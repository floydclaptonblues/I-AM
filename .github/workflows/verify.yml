name: Verify the encounter
on:
  push:
    branches: ['codex/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    timeout-minutes: 35
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test && npm run check
      - uses: ./.github/actions/prepare-voices
      - uses: actions/upload-artifact@v4
        with:
          name: synchronized-voice-recordings
          path: assets/audio/
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.56.1 axe-core@4.11.0
      - run: npx playwright install --with-deps chromium
      - name: Prepare pauseable garden fallback
        run: |
          sudo apt-get install -y ffmpeg
          node scripts/prepare-background.mjs
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: encounter-browser-review
          path: test-results/
