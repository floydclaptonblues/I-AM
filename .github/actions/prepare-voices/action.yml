name: Prepare synchronized voices
description: Render and cache the fixed robotic and British voice mix.
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      id: voice-cache
      with:
        path: assets/audio
        key: serpent-voices-v1-${{ hashFiles('dialogue.js','answer.js','speech.js','scripts/export-voice-script.mjs','scripts/render-voices.py','scripts/voice-requirements.txt') }}
    - uses: actions/setup-python@v6
      if: steps.voice-cache.outputs.cache-hit != 'true'
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: scripts/voice-requirements.txt
    - name: Install offline voice rendering tools
      if: steps.voice-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y espeak-ng libespeak-ng1 rubberband-cli ffmpeg
        python -m pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
        python -m pip install -r scripts/voice-requirements.txt
    - name: Render both voices onto one timeline
      if: steps.voice-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        TOKENIZERS_PARALLELISM: 'false'
      run: |
        node scripts/export-voice-script.mjs
        python -u scripts/render-voices.py
